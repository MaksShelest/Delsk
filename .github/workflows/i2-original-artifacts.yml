name: I2 original failed artifacts diagnosis
on:
  push:
    branches: [feat/vnext-i2-free-vehicle-control]
    paths: [.github/workflows/i2-original-artifacts.yml]
permissions:
  contents: read
  actions: read
jobs:
  original-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: i1-developer-regression
            artifact: '13274980136'
            bytes: '419122'
            sha256: 084ef7592f32115602af6568d53f075c12092ed7f6e7919697663e4834b6e1c6
    steps:
      - name: Read the original archive with bounded transfer and exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          EXPECTED_BYTES: ${{ matrix.bytes }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          timeout 120s python3 - <<'PY'
          import base64,hashlib,io,json,os,urllib.error,urllib.request,zipfile
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          request=urllib.request.Request('https://api.github.com/repos/MaksShelest/Delsk/actions/artifacts/'+os.environ['ARTIFACT_ID']+'/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
              response=urllib.request.build_opener(NoRedirect).open(request,timeout=30)
              data=response.read(32*1024*1024)
          except urllib.error.HTTPError as error:
              if error.code!=302:raise
              # The storage redirect is fetched without the GitHub credential.
              with urllib.request.urlopen(error.headers['Location'],timeout=30) as response:data=response.read(32*1024*1024)
          digest=hashlib.sha256(data).hexdigest()
          assert len(data)==int(os.environ['EXPECTED_BYTES']) and digest==os.environ['EXPECTED_SHA256']
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              print('I2_ORIGINAL_MANIFEST '+json.dumps([dict(name=n,bytes=len(archive.read(n)),sha256=hashlib.sha256(archive.read(n)).hexdigest()) for n in archive.namelist() if not n.endswith('/')]))
          print('I2_ORIGINAL_ZIP '+os.environ['FLAVOUR']+' '+digest+' '+str(len(data)))
          encoded=base64.b64encode(data).decode('ascii')
          for n in range(0,len(encoded),4096):print('I2_ZIP_CHUNK '+str(n//4096)+' '+encoded[n:n+4096])
          print('I2_ZIP_END '+str((len(encoded)+4095)//4096))
          PY
