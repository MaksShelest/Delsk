name: Godot platform probe
on:
  push:
    branches: ['feat/godot-platform-p06']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-core-replay:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_PROCESSOR_COUNT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned .NET editor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          python scripts/run_check.py --name godot-download --timeout 180 -- curl.exe --fail --location --silent --show-error --max-time 170 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip --output .tools/godot.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive .tools/godot.zip -DestinationPath .tools/godot
          $engine = (Get-ChildItem .tools/godot -Recurse -Filter '*_console.exe' | Select-Object -First 1).FullName
          if (!$engine) { throw 'Missing Godot .NET console executable' }
          "DELSK_GODOT=$engine" >> $env:GITHUB_ENV
      - name: Build client
        shell: pwsh
        run: |
          python scripts/run_check.py --name client-restore --timeout 180 -- dotnet restore src/Client.Godot/Delsk.Client.csproj --locked-mode --disable-parallel '-m:1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_check.py --name client-build --timeout 180 -- dotnet build src/Client.Godot/Delsk.Client.csproj --no-restore --disable-build-servers '-m:1'
          exit $LASTEXITCODE
      - name: Verify ordinary client assembly composition
        shell: pwsh
        run: |
          python scripts/run_check.py --name client-metadata --timeout 120 -- dotnet run --project tools/AssemblyAudit -c Release -- src/Client.Godot/.godot/mono/temp/bin/Debug
          exit $LASTEXITCODE
      - name: Record available real local LLM runtime separately from software gates
        shell: python
        run: |
          import json,pathlib,platform,shutil,subprocess
          runtime=shutil.which('ollama')
          report=dict(platform=platform.platform(),environment='GitHub hosted Windows VM',runtime=runtime,
            status='unavailable' if runtime is None else 'runtime-found-inference-still-required',inferencePerformed=False,
            scope='Availability evidence only. No fake response or historical run establishes a current real model inference; physical user Windows acceptance remains separate.')
          if runtime:
            result=subprocess.run([runtime,'--version'],capture_output=True,text=True,timeout=15)
            report.update(versionExitCode=result.returncode,versionOutput=result.stdout,versionError=result.stderr)
          path=pathlib.Path('artifacts/h3-real-runtime.json');path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
      - name: Import and replay shared core on Windows
        shell: pwsh
        run: |
          # Import identical assets without initializing a C# project in the editor.
          # Reuse validates every source byte/digest and copies no managed/editor state.
          # The ordinary Mono runtime and all release/Developer gates still run below.
          python scripts/run_check.py --name godot-asset-stage --timeout 30 -- python scripts/prepare_godot_asset_import.py --source src/Client.Godot --output artifacts/asset-import/source --report artifacts/asset-import/staged.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_check.py --name godot-import --timeout 120 -- $env:DELSK_GODOT --headless --path artifacts/asset-import/source --editor --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_check.py --name godot-cache-reuse --timeout 30 -- python scripts/reuse_godot_imports.py --source artifacts/asset-import/source --target src/Client.Godot --report artifacts/asset-import/reused.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_check.py --name godot-import-completeness --timeout 30 -- python scripts/reuse_godot_imports.py --source src/Client.Godot --verify-only --report artifacts/import-completeness.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_check.py --name godot-smoke --timeout 30 -- $env:DELSK_GODOT --headless --path src/Client.Godot -- --smoke --report "$env:GITHUB_WORKSPACE/artifacts/platform-probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_platform_probe.py --report artifacts/platform-probe.json --log-prefix artifacts/checks/godot-import --log-prefix artifacts/checks/godot-smoke
          exit $LASTEXITCODE
      - name: Release excludes the Debug menu
        shell: pwsh
        run: |
          python scripts/run_check.py --name release-ui-restore --timeout 180 -- dotnet restore src/Client.Godot/Delsk.Client.csproj -p:Configuration=ExportRelease --locked-mode --disable-parallel '-m:1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_check.py --name release-ui-build --timeout 180 -- dotnet build src/Client.Godot/Delsk.Client.csproj -c ExportRelease --no-restore --disable-build-servers '-m:1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_check.py --name release-ui-audit --timeout 120 -- dotnet run --project tools/AssemblyAudit -c Release -- src/Client.Godot/.godot/mono/temp/bin/ExportRelease --no-debug-ui
          exit $LASTEXITCODE
      - name: Verify HUD and Developer god mode
        shell: pwsh
        run: |
          python scripts/check_hud_god_ui.py --godot "$env:DELSK_GODOT" --output artifacts/hud-god-ui --import-cache src/Client.Godot
          exit $LASTEXITCODE
      - name: Failed check diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/checks -Filter '*.stderr.log' | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName -Tail 40 }
          Get-ChildItem artifacts/checks -Filter '*.stdout.log' | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName -Tail 40 }
      - name: Preserve files at the release cleanup boundary
        shell: pwsh
        run: |
          python scripts/run_check.py --name export-cleanup --timeout 45 -- $env:DELSK_GODOT --headless --path src/Client.Godot --script "$env:GITHUB_WORKSPACE/tests/Client.Probes/export-cleanup.gd" -- --output "$env:GITHUB_WORKSPACE/artifacts/export-cleanup" --debug-deps "$env:GITHUB_WORKSPACE/artifacts/hud-god-ui/client/source/src/Client.Godot/.godot/mono/temp/bin/ExportDebug/Delsk.Client.deps.json" --release-deps "$env:GITHUB_WORKSPACE/src/Client.Godot/.godot/mono/temp/bin/ExportRelease/Delsk.Client.deps.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_platform_probe.py --log-prefix artifacts/checks/export-cleanup
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-platform-probe
          path: artifacts/

  city-ux-native:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [city, compact, forms]
    env:
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned .NET editor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          python scripts/run_check.py --name godot-download --timeout 180 -- curl.exe --fail --location --silent --show-error --max-time 170 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip --output .tools/godot.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive .tools/godot.zip -DestinationPath .tools/godot
          $engine = (Get-ChildItem .tools/godot -Recurse -Filter '*_console.exe' | Select-Object -First 1).FullName
          if (!$engine) { throw 'Missing Godot .NET console executable' }
          "DELSK_GODOT=$engine" >> $env:GITHUB_ENV
      - name: Prepare ordinary-command G2 UI fixtures
        if: matrix.case == 'forms'
        shell: pwsh
        run: |
          python scripts/run_check.py --name city-ux-fixtures --timeout 780 --log-directory artifacts/gate-checks -- python scripts/check_headless.py --phase tests --suite ux --output artifacts/city-ux-fixtures
          exit $LASTEXITCODE
      - name: Disjoint ordinary city UX windows, RU and EN, narrow touch input and delivery regression
        shell: pwsh
        env:
          NATIVE_CASE: ${{ matrix.case }}
        run: |
          $arguments = @('--godot', "$env:DELSK_GODOT", '--output', 'artifacts/city-ux-ui', '--case', "$env:NATIVE_CASE")
          if ($env:NATIVE_CASE -eq 'forms') { $arguments += @('--fixtures', 'artifacts/city-ux-fixtures/g2-fixtures') }
          python scripts/run_check.py --name city-ux-native --timeout 600 --log-directory artifacts/gate-checks -- python scripts/check_city_experience_ui.py @arguments
          exit $LASTEXITCODE
      - name: Failed city UX check diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/gate-checks,artifacts/city-ux-ui/checks -Filter '*.stderr.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName -Tail 60 }
          Get-ChildItem artifacts/city-ux-ui -Recurse -Filter 'failure.json' -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.FullName; Get-Content $_.FullName }
      - name: Publish actual native results and retained errors
        if: always()
        shell: pwsh
        run: python scripts/report_check_results.py artifacts/city-ux-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-city-ux-${{ matrix.case }}
          path: artifacts/

  i5-context-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_PROCESSOR_COUNT: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare unprivileged software display and pinned Mono editor
        run: |
          python scripts/run_check.py --name i5-display-install --timeout 180 --log-directory artifacts/gate-checks -- sudo apt-get update
          python scripts/run_check.py --name i5-display-packages --timeout 180 --log-directory artifacts/gate-checks -- sudo apt-get install -y xvfb libgl1-mesa-dri
          mkdir -p .tools
          python scripts/run_check.py --name i5-editor-download --timeout 180 --log-directory artifacts/gate-checks -- curl --fail --location --silent --show-error --max-time 170 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip --output .tools/godot.zip
          unzip -q .tools/godot.zip -d .tools/godot
          chmod +x .tools/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
      - name: Actual ordinary start with three NPCs and independent audit
        run: |
          python scripts/run_check.py --name i5-ordinary-restore --timeout 180 --log-directory artifacts/gate-checks -- dotnet restore tools/I4Acceptance/I4Acceptance.csproj --locked-mode --disable-parallel -m:1
          python scripts/run_check.py --name i5-ordinary-build --timeout 180 --log-directory artifacts/gate-checks -- dotnet build tools/I4Acceptance/I4Acceptance.csproj -c Release --no-restore --disable-build-servers -m:1
          python scripts/run_check.py --name i5-ordinary --timeout 600 --log-directory artifacts/gate-checks -- dotnet tools/I4Acceptance/bin/Release/net10.0/I4Acceptance.dll artifacts/i5-ordinary
          python scripts/run_check.py --name i5-ordinary-audit --timeout 60 --log-directory artifacts/gate-checks -- python scripts/verify_results.py artifacts/i5-ordinary/export
      - name: RU EN native context input at 1280 800 and 360 pixels
        run: |
          python scripts/run_check.py --name i5-native --timeout 1200 --log-directory artifacts/gate-checks -- python scripts/check_i5_native.py --godot "$GITHUB_WORKSPACE/.tools/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" --xvfb Xvfb --fixtures artifacts/i5-ordinary --output artifacts/i5-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i5-native-context
          path: artifacts/

  city-ux-ui:
    if: ${{ always() }}
    needs: [city-ux-native, i5-context-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all nine native cases across bounded disjoint groups
        env:
          NATIVE_RESULT: ${{ needs.city-ux-native.result }}
          I5_RESULT: ${{ needs.i5-context-native.result }}
        run: test "$NATIVE_RESULT" = success && test "$I5_RESULT" = success
