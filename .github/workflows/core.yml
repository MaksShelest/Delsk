      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: road-command-fixtures
          path: artifacts/road-fixtures
      - name: Bounded runner restore and build
        run: |
          python scripts/run_check.py --name roads-restore --timeout 180 -- dotnet restore src/Research.Runner/Research.Runner.csproj --locked-mode --disable-parallel -m:1
          python scripts/run_check.py --name roads-build --timeout 180 -- dotnet build src/Research.Runner/Research.Runner.csproj -c Release --no-restore --disable-build-servers -m:1
      - name: E2 physical works, traffic, continuation and independent audits
        run: python scripts/run_check.py --name roads-e2 --timeout 600 -- python scripts/check_road_e2.py --fixtures artifacts/road-fixtures --output artifacts/roads-e2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roads-checks-and-runs
          path: artifacts/
