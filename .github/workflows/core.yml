      - name: Complete E2 Developer suite and forbidden Release
        run: python scripts/run_check.py --name road-developer --timeout 600 --log-directory artifacts/gate-checks -- python scripts/check_developer.py --suite roads --output artifacts/road-developer
      - uses: actions/upload-artifact@v4
        if: always()
