name: Core and research slice
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore locked dependencies
        run: python scripts/run_check.py --name restore --timeout 180 -- dotnet restore Delsk.sln --locked-mode --disable-parallel -m:1
      - name: Build
        run: python scripts/run_check.py --name build --timeout 180 -- dotnet build Delsk.sln -c Release --no-restore --disable-build-servers -m:1
      - name: xUnit
        run: python scripts/run_check.py --name tests --timeout 120 -- dotnet test --project tests/Simulation.Tests/Simulation.Tests.csproj -c Release --no-build --no-restore -- --report-trx --results-directory artifacts/test-results --minimum-expected-tests 281
      - name: Economic cycle
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: python scripts/run_check.py --name cycle --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/economic-cycle.json --output artifacts/cycle
      - name: Zero-cash recovery
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: python scripts/run_check.py --name recovery --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/zero-cash-recovery.json --script recovery --output artifacts/recovery
      - name: Two chains and construction
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: python scripts/run_check.py --name development --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/land-and-content.json --script development --output artifacts/development
      - name: Labor delay, idle and rehiring
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: python scripts/run_check.py --name labor --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/labor-dynamics.json --script labor --output artifacts/labor
      - name: Equipment purchase, personal and automatic extraction
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: python scripts/run_check.py --name equipment --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/equipment-cycle.json --script equipment --output artifacts/equipment
      - name: Save and continue physical cargo
        run: |
          python scripts/run_check.py --name cycle-save --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/economic-cycle.json --checkpoint artifacts/cycle.save.json --checkpoint-at 55 --output artifacts/cycle-saved
          python scripts/run_check.py --name cycle-load --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --load artifacts/cycle.save.json --output artifacts/cycle-loaded
      - name: Save and continue extraction WIP
        run: |
          python scripts/run_check.py --name equipment-save --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/equipment-cycle.json --script equipment --checkpoint artifacts/equipment.save.json --checkpoint-at 101 --output artifacts/equipment-saved
          python scripts/run_check.py --name equipment-load --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --load artifacts/equipment.save.json --output artifacts/equipment-loaded
      - name: Autonomous NPC economy and checkpoint
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: |
          python scripts/run_check.py --name autonomous --timeout 300 -- dotnet run --project src/Research.Runner -c Release --no-build -- --script autonomous --output artifacts/autonomous
          python scripts/run_check.py --name autonomous-save --timeout 300 -- dotnet run --project src/Research.Runner -c Release --no-build -- --script autonomous --checkpoint artifacts/autonomous.save.json --checkpoint-at 350 --output artifacts/autonomous-saved
          python scripts/run_check.py --name autonomous-load --timeout 300 -- dotnet run --project src/Research.Runner -c Release --no-build -- --load artifacts/autonomous.save.json --ticks 1000 --output artifacts/autonomous-loaded
      - name: Market auction and restored round
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: |
          python scripts/run_check.py --name market --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/market-window.json --script market --output artifacts/market
          python scripts/run_check.py --name market-save --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/market-window.json --script market --checkpoint artifacts/market.save.json --checkpoint-at 44 --output artifacts/market-saved
          python scripts/run_check.py --name market-load --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --load artifacts/market.save.json --output artifacts/market-loaded
      - name: Physical partial pickup and expiry during return trip
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: |
          python scripts/run_check.py --name pickup --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/pickup-lifecycle.json --script pickup --output artifacts/pickup
          python scripts/run_check.py --name pickup-save --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/pickup-lifecycle.json --script pickup --checkpoint artifacts/pickup.save.json --checkpoint-at 47 --output artifacts/pickup-saved
          python scripts/run_check.py --name pickup-load --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --load artifacts/pickup.save.json --output artifacts/pickup-loaded
      - name: Participant and capital delivery contracts
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: |
          python scripts/run_check.py --name delivery --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/delivery-lifecycle.json --script delivery --output artifacts/delivery
          python scripts/run_check.py --name delivery-save --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/delivery-lifecycle.json --script delivery --checkpoint artifacts/delivery.save.json --checkpoint-at 37 --output artifacts/delivery-saved
          python scripts/run_check.py --name delivery-load --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --load artifacts/delivery.save.json --output artifacts/delivery-loaded
          python scripts/run_check.py --name capital-delivery --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/capital-delivery.json --script capital-delivery --output artifacts/capital-delivery
          python scripts/run_check.py --name capital-delivery-save --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/capital-delivery.json --script capital-delivery --checkpoint artifacts/capital-delivery.save.json --checkpoint-at 3 --output artifacts/capital-delivery-saved
          python scripts/run_check.py --name capital-delivery-load --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --load artifacts/capital-delivery.save.json --output artifacts/capital-delivery-loaded
      - name: Numerical logistics crew and physical round trip
        env:
          DELSK_COMMIT: ${{ github.sha }}
        run: |
          python scripts/run_check.py --name logistics --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/logistics-cycle.json --script logistics --output artifacts/logistics
          python scripts/run_check.py --name logistics-save --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --scenario scenarios/logistics-cycle.json --script logistics --checkpoint artifacts/logistics.save.json --checkpoint-at 69 --output artifacts/logistics-saved
          python scripts/run_check.py --name logistics-load --timeout 30 -- dotnet run --project src/Research.Runner -c Release --no-build -- --load artifacts/logistics.save.json --output artifacts/logistics-loaded
      - name: Compare restored exports
        run: python scripts/verify_checkpoint_exports.py artifacts/cycle artifacts/cycle-loaded artifacts/equipment artifacts/equipment-loaded artifacts/autonomous artifacts/autonomous-loaded artifacts/market artifacts/market-loaded artifacts/pickup artifacts/pickup-loaded artifacts/delivery artifacts/delivery-loaded artifacts/capital-delivery artifacts/capital-delivery-loaded artifacts/logistics artifacts/logistics-loaded
      - name: Check output balances
        run: python scripts/verify_results.py artifacts/cycle artifacts/recovery artifacts/development artifacts/labor artifacts/equipment artifacts/cycle-loaded artifacts/equipment-loaded artifacts/autonomous artifacts/autonomous-loaded artifacts/market artifacts/market-loaded artifacts/pickup artifacts/pickup-loaded artifacts/delivery artifacts/delivery-loaded artifacts/capital-delivery artifacts/capital-delivery-loaded artifacts/logistics artifacts/logistics-loaded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-and-runs
          path: artifacts/
