name: Core and research slice
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded complete headless gate (P00-P22)
        env:
          DELSK_COMMIT: ${{ github.sha }}
          DOTNET_PROCESSOR_COUNT: '2'
        run: python scripts/run_check.py --name headless --timeout 780 --log-directory artifacts/gate-checks -- python scripts/check_headless.py --output artifacts/headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-and-runs
          path: artifacts/
