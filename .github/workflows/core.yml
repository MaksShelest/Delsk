        run: python scripts/run_check.py --name npc-actions --timeout 780 --log-directory artifacts/gate-checks -- python scripts/check_npc_actions_g1.py --fixtures artifacts/npc-fixtures --output artifacts/npc-actions
      - name: Actual G1 counters and failed process logs
        if: always()
        run: python scripts/report_check_results.py artifacts/npc-actions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-actions-checks
          path: artifacts/
  npc-natural:
    strategy:
      fail-fast: false
      matrix:
        map: [small-river, large-districts]
        bots: [3, 6, 10]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded runner build
        run: |
          python scripts/run_check.py --name npc-restore --timeout 180 -- dotnet restore src/Research.Runner/Research.Runner.csproj --locked-mode --disable-parallel -m:1
          python scripts/run_check.py --name npc-build --timeout 180 -- dotnet build src/Research.Runner/Research.Runner.csproj -c Release --no-restore --disable-build-servers -m:1
      - name: Natural start, checkpoint and replay, without staged cash or goods
        run: python scripts/run_check.py --name npc-natural --timeout 1080 --log-directory artifacts/gate-checks -- python scripts/check_npc_g1.py --map ${{ matrix.map }} --bots ${{ matrix.bots }} --output artifacts/npc-natural
      - name: Actual G1 counters and failed process logs
        if: always()
        run: python scripts/report_check_results.py artifacts/npc-natural
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-natural-${{ matrix.map }}-${{ matrix.bots }}
          path: artifacts/
  # Preserve the required check and require every suite, including D3's independent audit.
  verify:
    if: ${{ always() }}
    needs: [unit, core, developer, production, fleet, road-unit, road-developer, roads, billing-unit, billing-developer, billing, services-unit, services-developer, services, service-runs-unit, service-runs-developer, service-runs, npc-unit, npc-developer, npc-actions, npc-natural]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all complete suites
        env:
          NPC_UNIT_RESULT: ${{ needs.npc-unit.result }}
          NPC_DEVELOPER_RESULT: ${{ needs.npc-developer.result }}
          NPC_ACTIONS_RESULT: ${{ needs.npc-actions.result }}
          NPC_NATURAL_RESULT: ${{ needs.npc-natural.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          CORE_RESULT: ${{ needs.core.result }}
          DEVELOPER_RESULT: ${{ needs.developer.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          ROAD_UNIT_RESULT: ${{ needs.road-unit.result }}
          ROAD_DEVELOPER_RESULT: ${{ needs.road-developer.result }}
          ROADS_RESULT: ${{ needs.roads.result }}
          BILLING_UNIT_RESULT: ${{ needs.billing-unit.result }}
          BILLING_DEVELOPER_RESULT: ${{ needs.billing-developer.result }}
          BILLING_RESULT: ${{ needs.billing.result }}
          SERVICES_UNIT_RESULT: ${{ needs.services-unit.result }}
          SERVICES_DEVELOPER_RESULT: ${{ needs.services-developer.result }}
          RUNS_UNIT_RESULT: ${{ needs.service-runs-unit.result }}
          RUNS_DEVELOPER_RESULT: ${{ needs.service-runs-developer.result }}
          RUNS_RESULT: ${{ needs.service-runs.result }}
          SERVICES_RESULT: ${{ needs.services.result }}
          FLEET_RESULT: ${{ needs.fleet.result }}
        run: test "$NPC_UNIT_RESULT" = success && test "$NPC_DEVELOPER_RESULT" = success && test "$NPC_ACTIONS_RESULT" = success && test "$NPC_NATURAL_RESULT" = success && test "$UNIT_RESULT" = success && test "$CORE_RESULT" = success && test "$DEVELOPER_RESULT" = success && test "$PRODUCTION_RESULT" = success && test "$FLEET_RESULT" = success && test "$ROADS_RESULT" = success && test "$ROAD_UNIT_RESULT" = success && test "$ROAD_DEVELOPER_RESULT" = success && test "$BILLING_UNIT_RESULT" = success && test "$BILLING_DEVELOPER_RESULT" = success && test "$BILLING_RESULT" = success && test "$SERVICES_UNIT_RESULT" = success && test "$SERVICES_DEVELOPER_RESULT" = success && test "$SERVICES_RESULT" = success && test "$RUNS_UNIT_RESULT" = success && test "$RUNS_DEVELOPER_RESULT" = success && test "$RUNS_RESULT" = success
