name: Core and research slice
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_PROCESSOR_COUNT: '2'
      DELSK_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive ordinary unit gate with unchanged partition deadlines
        run: python scripts/run_check.py --name unit --timeout 780 --log-directory artifacts/gate-checks -- python scripts/check_headless.py --phase tests --suite previous --output artifacts/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-checks-and-fixtures
          path: artifacts/unit/
  core:
    needs: [unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CI partition and import-cache boundaries
        run: python scripts/run_check.py --name ci-tools-unit --timeout 30 --log-directory artifacts/gate-checks -- python -m unittest discover -s tests/Checks -v
      - name: Research laboratory startup, queue and HTTP boundaries
        run: python scripts/run_check.py --name research-lab-unit --timeout 60 --log-directory artifacts/gate-checks -- python -m unittest discover -s tests/Research.Lab -v
      - name: Reproducible vNext catalog extraction
        run: python scripts/run_check.py --name catalog-source --timeout 15 --log-directory artifacts/gate-checks -- python scripts/extract_vnext_catalog.py --check
      - name: Reproducible full vNext balance extraction
        run: python scripts/run_check.py --name balance-source --timeout 15 --log-directory artifacts/gate-checks -- python scripts/extract_vnext_balance.py --check
      - uses: actions/download-artifact@v4
        with:
          name: unit-checks-and-fixtures
          path: artifacts/unit
      - name: Bounded complete headless gate (P00-P22)
        env:
          DELSK_COMMIT: ${{ github.sha }}
          DOTNET_PROCESSOR_COUNT: '2'
        run: python scripts/run_check.py --name headless --timeout 780 --log-directory artifacts/gate-checks -- python scripts/check_headless.py --phase runs --unit-artifacts artifacts/unit --output artifacts/headless
      - name: Catalog-only CLI and legacy save/load/replay
        run: python scripts/run_check.py --name catalog-cli --timeout 180 --log-directory artifacts/gate-checks -- python scripts/check_vnext_catalog.py --output artifacts/vnext-catalog
      - name: Full B1 semantic CLI, supported production and WIP save/load/replay
        run: python scripts/run_check.py --name balance-cli --timeout 180 --log-directory artifacts/gate-checks -- python scripts/check_vnext_balance.py --output artifacts/vnext-balance
      - name: Ordinary 3/6/10 NPC setup, replay and accounting
        run: python scripts/run_check.py --name ordinary-game --timeout 300 --log-directory artifacts/gate-checks -- python scripts/check_ordinary_game.py --output artifacts/ordinary-game --voting-check
      - name: Exact C# map snapshots and compatible profiles
        run: python scripts/run_check.py --name map-designs --timeout 180 --log-directory artifacts/gate-checks -- python scripts/check_map_designs.py --output artifacts/map-designs
      - name: C1 storage, real projection and physical save/load/replay
        run: python scripts/run_check.py --name storage-c1 --timeout 300 --log-directory artifacts/gate-checks -- python scripts/check_storage_c1.py --output artifacts/storage-c1
      - name: C2 preparation, demolition, salvage and save/load/replay
        run: python scripts/run_check.py --name demolition-c2 --timeout 240 --log-directory artifacts/gate-checks -- python scripts/check_demolition_c2.py --output artifacts/demolition-c2
      - name: D1 parallel workshops, real outfit, payroll and checkpoint replay
        run: python scripts/run_check.py --name workshops-d1 --timeout 240 --log-directory artifacts/gate-checks -- python scripts/check_workshops_d1.py --output artifacts/workshops-d1
      - name: D2 shared experience, funded quests and paid projects
        run: python scripts/run_check.py --name development-d2 --timeout 240 --log-directory artifacts/gate-checks -- python scripts/check_development_d2.py --fixtures artifacts/unit/d2-fixtures --output artifacts/development-d2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-and-runs
          path: artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: production-command-fixtures
          path: |
            artifacts/unit/d3-fixtures/*.json
            artifacts/unit/d3-fixtures/*.jsonl
            artifacts/unit/d3-fixtures/*.tick
            !artifacts/unit/d3-fixtures/*.save.json
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-command-fixtures
          path: |
            artifacts/unit/e1-fixtures/*.json
            artifacts/unit/e1-fixtures/*.jsonl
            artifacts/unit/e1-fixtures/*.tick
            !artifacts/unit/e1-fixtures/*.save.json
  road-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
