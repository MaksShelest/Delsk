name: Core and research slice
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research laboratory startup, queue and HTTP boundaries
        run: python scripts/run_check.py --name research-lab-unit --timeout 60 --log-directory artifacts/gate-checks -- python -m unittest discover -s tests/Research.Lab -v
      - name: Reproducible vNext catalog extraction
        run: python scripts/run_check.py --name catalog-source --timeout 15 --log-directory artifacts/gate-checks -- python scripts/extract_vnext_catalog.py --check
      - name: Reproducible full vNext balance extraction
        run: python scripts/run_check.py --name balance-source --timeout 15 --log-directory artifacts/gate-checks -- python scripts/extract_vnext_balance.py --check
      - name: Bounded complete headless gate (P00-P22)
        env:
          DELSK_COMMIT: ${{ github.sha }}
          DOTNET_PROCESSOR_COUNT: '2'
        run: python scripts/run_check.py --name headless --timeout 780 --log-directory artifacts/gate-checks -- python scripts/check_headless.py --output artifacts/headless
      - name: Catalog-only CLI and legacy save/load/replay
        run: python scripts/run_check.py --name catalog-cli --timeout 180 --log-directory artifacts/gate-checks -- python scripts/check_vnext_catalog.py --output artifacts/vnext-catalog
      - name: Full B1 semantic CLI, supported production and WIP save/load/replay
        run: python scripts/run_check.py --name balance-cli --timeout 180 --log-directory artifacts/gate-checks -- python scripts/check_vnext_balance.py --output artifacts/vnext-balance
      - name: Ordinary 3/6/10 NPC setup, replay and accounting
        run: python scripts/run_check.py --name ordinary-game --timeout 300 --log-directory artifacts/gate-checks -- python scripts/check_ordinary_game.py --output artifacts/ordinary-game --voting-check
      - name: Exact C# map snapshots and compatible profiles
        run: python scripts/run_check.py --name map-designs --timeout 180 --log-directory artifacts/gate-checks -- python scripts/check_map_designs.py --output artifacts/map-designs
      - name: Bounded Developer tests and forbidden Release gate
        env:
          DOTNET_PROCESSOR_COUNT: '2'
        run: python scripts/run_check.py --name developer --timeout 600 --log-directory artifacts/gate-checks -- python scripts/check_developer.py --output artifacts/developer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-and-runs
          path: artifacts/
