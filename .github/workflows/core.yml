name: Core and research slice
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research laboratory startup, queue and HTTP boundaries
        run: python scripts/run_check.py --name research-lab-unit --timeout 60 --log-directory artifacts/gate-checks -- python -m unittest discover -s tests/Research.Lab -v
      - name: Bounded complete headless gate (P00-P22)
        env:
          DELSK_COMMIT: ${{ github.sha }}
          DOTNET_PROCESSOR_COUNT: '2'
        run: python scripts/run_check.py --name headless --timeout 780 --log-directory artifacts/gate-checks -- python scripts/check_headless.py --output artifacts/headless
      - name: Bounded Developer tests and forbidden Release gate
        env:
          DOTNET_PROCESSOR_COUNT: '2'
        run: python scripts/run_check.py --name developer --timeout 600 --log-directory artifacts/gate-checks -- python scripts/check_developer.py --output artifacts/developer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-and-runs
          path: artifacts/
